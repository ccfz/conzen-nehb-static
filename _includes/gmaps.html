<!-- Map Placeholder (shown when no consent or consent declined) -->
<div id="map-placeholder">
  <div class="map-placeholder-content">
    <h4>Google Maps</h4>
    <p>Um die Karte anzuzeigen, müssen Sie der Nutzung von Google Maps zustimmen. Dadurch werden Daten an Google übertragen.</p>
    <button id="load-map" class="btn-load-map">Google Maps laden</button>
  </div>
</div>

<!-- Google Maps (shown when consent is given) -->
<div id="google-maps">
  <div class="hidden-xs">
    <iframe
      width="100%"
      height="350px"
      alt="Google Maps"
      style="border:0"
      src="https://www.google.com/maps/embed/v1/place?key=AIzaSyDluPLo2_0tKj7o3TbWiCAvAvdBfOoBYMw&q=Julius-Brecht-Straße,+Hamburg,+Deutschland" allowfullscreen>
    </iframe>
  </div>

  <div class="visible-xs">
    <iframe
      width="100%"
      height="250"
      src="https://www.google.com/maps/embed/v1/place?key=AIzaSyDluPLo2_0tKj7o3TbWiCAvAvdBfOoBYMw&q=Julius-Brecht-Straße,+Hamburg,+Deutschland" allowfullscreen>
    </iframe>
  </div>
</div>
